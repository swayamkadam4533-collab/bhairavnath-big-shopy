<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b3b"><title>Admin · Bhairavnath big shopy</title>
<style>
:root{--g:#075b3b;--g2:#0b8154;--bg:#f4f7f5;--line:#dce7df}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:#18251d}.top{background:var(--g);color:white;padding:18px}.wrap{max-width:1100px;margin:auto;padding:18px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:5px 0 12px;font:inherit}button{border:0;border-radius:8px;padding:10px 13px;background:var(--g2);color:white;font-weight:700;cursor:pointer;margin:3px}button.alt{background:#e3f2e9;color:var(--g)}button.red{background:#b42318}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:12px 0}.muted{color:#617268;font-size:13px}.status{display:inline-block;background:#fff0bf;padding:4px 8px;border-radius:999px;font-size:12px}.hidden{display:none!important}.notice{padding:12px;background:#fff4ce;border-radius:8px;margin:10px 0}.error{color:#a51e1e}
</style></head><body><header class="top"><b>🛒 Bhairavnath big shopy — Admin Panel</b><div class="muted" style="color:#d7eee0">Manage products and store pickup orders</div></header><main class="wrap">
<div id="setup" class="notice">Firebase configuration is required. Follow README.md to connect your free Firebase project.</div>
<section id="loginPanel" class="panel"><h2>Admin Login</h2><p class="muted">Use the admin account you create in Firebase Authentication.</p><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Login</button><div id="loginMsg" class="error"></div></section>
<div id="app" class="hidden"><section class="panel"><div class="row"><div><h2>Dashboard</h2><div id="counts" class="muted"></div></div><button id="logoutBtn" class="alt">Log out</button></div></section>
<section class="panel"><h2>Add / Update Product</h2><form id="productForm"><input id="productId" type="hidden"><div class="grid"><div><label>Product name (English) *</label><input id="nameEn" required></div><div><label>Product name (Marathi)</label><input id="nameMr"></div><div><label>Product name (Hindi)</label><input id="nameHi"></div><div><label>Category *</label><input id="category" required placeholder="Grains, Pulses, Oil..."></div><div><label>Price (₹) *</label><input id="price" type="number" min="0" step="0.01" required></div><div><label>Stock quantity</label><input id="stock" type="number" min="0" step="1" value="0"></div><div><label>Emoji / icon</label><input id="emoji" maxlength="8" value="🛍️"></div><div><label>Available for sale</label><select id="active"><option value="true">Yes</option><option value="false">No</option></select></div></div><button type="submit">Save Product</button><button type="button" id="clearForm" class="alt">Clear</button><div id="productMsg" class="muted"></div></form></section>
<section class="panel"><h2>Products</h2><div id="products"></div></section><section class="panel"><h2>Orders</h2><div class="grid"><div><label>Filter status</label><select id="statusFilter"><option value="">All orders</option><option>Pending</option><option>Preparing</option><option>Ready for Pickup</option><option>Completed</option><option>Cancelled</option></select></div><div><label>Search order / phone</label><input id="orderSearch" placeholder="Order ID or phone"></div></div><div id="orders"></div></section></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,query,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"PASTE_API_KEY",authDomain:"PASTE_PROJECT_ID.firebaseapp.com",projectId:"PASTE_PROJECT_ID",storageBucket:"PASTE_PROJECT_ID.appspot.com",messagingSenderId:"PASTE_SENDER_ID",appId:"PASTE_APP_ID"};
const configured=firebaseConfig.apiKey!=="PASTE_API_KEY"&&firebaseConfig.projectId!=="PASTE_PROJECT_ID";
let auth,db,allProducts=[],allOrders=[];
const $=id=>document.getElementById(id);
if(configured){const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);$("setup").classList.add("hidden");onAuthStateChanged(auth,user=>{if(user){$("loginPanel").classList.add("hidden");$("app").classList.remove("hidden");refresh();}else{$("loginPanel").classList.remove("hidden");$("app").classList.add("hidden");}});}else{$("loginMsg").textContent="Not connected yet. Complete README setup and paste Firebase config into admin.html and index.html.";}
$("loginBtn").onclick=async()=>{if(!configured)return;try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value);$("loginMsg").textContent="";}catch(e){$("loginMsg").textContent="Login failed: "+e.message;}};
$("logoutBtn").onclick=()=>signOut(auth);
async function refresh(){if(!db)return;let [ps,os]=await Promise.all([getDocs(collection(db,"products")),getDocs(query(collection(db,"orders"),limit(200)))]);allProducts=ps.docs.map(d=>({id:d.id,...d.data()}));allOrders=os.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));renderProducts();renderOrders();$("counts").textContent=`${allProducts.length} products · ${allOrders.filter(o=>o.status==="Pending").length} pending · ${allOrders.filter(o=>o.status==="Ready for Pickup").length} ready for pickup`;}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=n=>"₹"+Number(n||0).toFixed(2).replace(/\.00$/,"");
function renderProducts(){$("products").innerHTML=allProducts.map(p=>`<div class="row"><div><b>${esc(p.emoji||"🛍️")} ${esc(p.name?.en||p.name||"Product")}</b><div class="muted">${esc(p.category)} · ${money(p.price)} · Stock: ${p.stock??0} · ${p.active===false?"Hidden":"Active"}</div></div><div><button class="alt" data-edit="${p.id}">Edit</button><button class="red" data-delete="${p.id}">Delete</button></div></div>`).join("")||"<p>No products yet.</p>";document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this product?")){await deleteDoc(doc(db,"products",b.dataset.delete));refresh();}});}
function editProduct(id){let p=allProducts.find(x=>x.id===id);if(!p)return;$("productId").value=id;$("nameEn").value=p.name?.en||p.name||"";$("nameMr").value=p.name?.mr||"";$("nameHi").value=p.name?.hi||"";$("category").value=p.category||"";$("price").value=p.price||0;$("stock").value=p.stock||0;$("emoji").value=p.emoji||"🛍️";$("active").value=String(p.active!==false);window.scrollTo({top:0,behavior:"smooth"});}
$("clearForm").onclick=()=>{$("productForm").reset();$("productId").value="";$("emoji").value="🛍️";};
$("productForm").onsubmit=async e=>{e.preventDefault();let data={name:{en:$("nameEn").value.trim(),mr:$("nameMr").value.trim()||$("nameEn").value.trim(),hi:$("nameHi").value.trim()||$("nameEn").value.trim()},category:$("category").value.trim(),price:Number($("price").value),stock:Number($("stock").value||0),emoji:$("emoji").value||"🛍️",active:$("active").value==="true",updatedAt:serverTimestamp()};try{let id=$("productId").value;if(id)await updateDoc(doc(db,"products",id),data);else await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});$("productMsg").textContent="Product saved."; $("productForm").reset();$("productId").value="";$("emoji").value="🛍️";refresh();}catch(err){$("productMsg").textContent="Save failed: "+err.message;}};
function renderOrders(){let status=$("statusFilter").value,q=$("orderSearch").value.toLowerCase();let rows=allOrders.filter(o=>(!status||o.status===status)&&(`${o.id} ${o.phone} ${o.customerName}`).toLowerCase().includes(q));$("orders").innerHTML=rows.map(o=>`<div class="row"><div style="min-width:210px;flex:1"><b>${esc(o.customerName)} · ${money(o.total)}</b><div class="muted">ID: ${esc(o.id)} · Phone: ${esc(o.phone)}</div><div class="muted">Pickup: ${esc(o.pickup)} · Pay: ${esc(o.payment)}</div><div class="muted">${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join(", ")}</div><span class="status">${esc(o.status||"Pending")}</span></div><div><select data-status="${o.id}" aria-label="Order status"><option ${o.status==="Pending"?"selected":""}>Pending</option><option ${o.status==="Preparing"?"selected":""}>Preparing</option><option ${o.status==="Ready for Pickup"?"selected":""}>Ready for Pickup</option><option ${o.status==="Completed"?"selected":""}>Completed</option><option ${o.status==="Cancelled"?"selected":""}>Cancelled</option></select><button data-save="${o.id}">Update</button></div></div>`).join("")||"<p>No orders match.</p>";document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{let id=b.dataset.save,status=document.querySelector(`[data-status="${id}"]`).value;await updateDoc(doc(db,"orders",id),{status,updatedAt:serverTimestamp()});refresh();});}
$("statusFilter").onchange=renderOrders;$("orderSearch").oninput=renderOrders;
</script></body></html>
